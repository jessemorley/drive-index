<!doctype html>
<!-- Duplicates review: sets of folders, then loose files, on the left; the selected one on the right.
     DuplicatesWebPane calls render(data); clicks go back as messages -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
body { padding: 0; height: 100vh; overflow: hidden; display: grid; grid-template-columns: minmax(280px, 34%) 1fr; }
#side, #detail { overflow-y: auto; min-width: 0; }
/* The columns scroll under the toolbar, like native lists */
#side { padding: calc(var(--top, 0px) + 10px) 10px 16px; border-right: 0.5px solid var(--separator); }
#detail { padding: calc(var(--top, 0px) + 16px) 24px 24px; }

.name, .path, .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.small { font-size: 11px; color: var(--secondary); }
.spacer { flex: 1; }

/* MARK: List */
.heading { display: flex; align-items: baseline; gap: 6px; padding: 8px 10px 6px; font-weight: 600; }
.heading .secondary { font-weight: normal; }
.item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; margin-bottom: 1px; }
.item:hover { background: var(--hover); }
.item .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item .size { font-variant-numeric: tabular-nums; color: var(--secondary); }
.item.sel { background: var(--blue); color: white; }
.item.sel .small, .item.sel .size { color: #ffffffd0; }
#more { display: flex; justify-content: center; padding: 8px 0; }
#more[hidden] { display: none; }

button.push {
  width: auto; height: 22px; padding: 0 10px; border-radius: 6px; color: var(--label); white-space: nowrap;
  background: var(--card); border: 0.5px solid var(--card-border);
}
button.push.primary { background: var(--blue); color: white; border-color: transparent; }

/* MARK: Detail */
#detail > * { animation: in .35s var(--ease) backwards; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
h1 { font-size: 17px; font-weight: 600; margin: 0; }
.meta { color: var(--secondary); margin: 2px 0 18px; }
.section { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 6px; font-weight: 600; }
.legend { display: flex; gap: 10px; font-size: 11px; font-weight: normal; color: var(--secondary); flex-wrap: wrap; justify-content: flex-end; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.card { background: var(--card); border: 0.5px solid var(--card-border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.row + .row { border-top: 0.5px solid var(--separator); }
.row .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.path { flex: 1; color: var(--secondary); }
.drive { font-weight: 500; white-space: nowrap; }
.off .drive, .off .path { color: var(--tertiary); }
.member.kept { background: color-mix(in srgb, var(--blue) 9%, transparent); }
.member input { accent-color: var(--blue); margin: 0; flex: none; }
.tag { font-size: 11px; font-weight: 600; color: var(--blue); }
.status.keep { color: var(--blue); }
.status.safe { color: var(--green); }

.bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--separator); }
.bar i { width: 0; transition: width .6s var(--ease); }
.shared { background: var(--tertiary); }
.changed { background: var(--orange); }
.only { background: var(--blue); }
.unchecked { background: transparent; box-shadow: inset 0 0 0 0.5px var(--secondary); }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.clear { display: flex; align-items: center; gap: 8px; }
.clear svg { width: 16px; height: 16px; color: var(--green); flex: none; }
.note { display: flex; gap: 6px; align-items: center; margin: -10px 4px 18px; }
.note svg { width: 13px; height: 13px; flex: none; }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
</style></head>
<body><div id="side"><div id="list"></div><div id="more" hidden><button class="push"></button></div></div><div id="detail"></div>
<script>
const ICON = {
  trash: '<svg viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"/><path d="m5.2 8.2 1.9 1.9 3.7-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  info: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"/><path d="M8 7.2V11.5M8 4.8v.1" fill="none" stroke="currentColor" stroke-linecap="round"/></svg>',
};
const EASE = 'cubic-bezier(.2, .8, .2, 1)';
const list = document.getElementById('list');
const detail = document.getElementById('detail');
const more = document.querySelector('#more button');
more.addEventListener('click', () => post({ action: 'more' }));

let data = { sets: [], groups: [], more: 0 };
let items = [];             // { kind: 'heading' | 'set' | 'file', id, d }, in list order
const rows = new Map();     // item id → its list element
let sel = null;             // id of the selected item
const keepBy = new Map();   // set id → index of the folder to keep, once picked
const bars = new Map();     // member or file id → the bar widths last shown, so a redraw slides from them

const post = message => webkit.messageHandlers.native.postMessage(message);
// WebKit's own menu (Reload, Inspect Element) gives the page away; rows ask for a native one
document.addEventListener('contextmenu', e => e.preventDefault());

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html) node.innerHTML = html;  // only ever our own ICON markup
  return node;
}
function text(cls, value) { const node = el('span', cls); node.textContent = value; return node; }
/// A Finder icon, served by Swift on the icon: scheme
function icon(src) { const img = el('img', 'icon'); img.src = src; return img; }
function button(label, cls, onClick, disabled) {
  const b = el('button', cls);
  b.textContent = label;
  b.disabled = !!disabled;
  b.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  return b;
}
const n = x => x.toLocaleString();
const plural = (x, one, many) => n(x) + ' ' + (x === 1 ? one : many);

// MARK: Middle truncation, like the native lists: CSS can only cut at the end

const measure = document.createElement('canvas').getContext('2d');
measure.font = '13px system-ui';

/// Text that's cut in the middle when it doesn't fit; the full text is its tooltip
function fitText(cls, value) {
  const node = text(cls + ' fit', value);
  node.dataset.full = node.title = value;
  return node;
}
function fit(nodes) {
  // Full text first, so each one's width is the room it has; then read them all, then write them all
  for (const x of nodes) x.textContent = x.dataset.full;
  const widths = nodes.map(x => x.clientWidth);
  nodes.forEach((x, i) => { x.textContent = middle(x.dataset.full, widths[i]); });
}
function middle(t, width) {
  const fits = s => measure.measureText(s).width <= width;
  if (fits(t)) return t;
  const cut = k => t.slice(0, Math.ceil(k / 2)) + '…' + t.slice(t.length - Math.floor(k / 2));
  let lo = 0, hi = t.length;  // characters kept
  while (lo < hi) { const k = (lo + hi + 1) >> 1; fits(cut(k)) ? lo = k : hi = k - 1; }
  return cut(lo);
}

// MARK: List

function fillRow(row, it) {
  if (it.kind === 'heading') {
    row.className = 'heading';
    row.replaceChildren(text('', it.d.title), text('secondary', it.d.count));
    return;
  }
  const d = it.d;
  const sub = it.kind === 'set' ? d.members.length + ' folders' : d.copies + ' copies · ' + d.size;
  const textCol = el('div', 'text');
  textCol.append(text('name', d.name), text('small', sub));
  textCol.firstChild.title = d.name;
  row.className = 'item' + (it.id === sel ? ' sel' : '');
  row.replaceChildren(icon(it.kind === 'set' ? 'icon://folder' : d.icon), textCol, text('size', d.wasted));
}

function drawList(fresh) {
  const ids = new Set(items.map(it => it.id));
  for (const [id, row] of rows) {
    if (ids.has(id)) continue;
    rows.delete(id);
    // A trashed set shrinks away, so what's under it slides up
    if (fresh) { row.remove(); continue; }
    row.style.pointerEvents = 'none';
    row.animate([{ height: row.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' }],
                { duration: 300, easing: EASE }).finished.then(() => row.remove());
  }
  // Back to front, so each row goes in before the one after it; only rows out of place move
  let next = null;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    let row = rows.get(it.id);
    if (!row) {
      row = el('div');
      if (it.kind !== 'heading') row.addEventListener('click', () => select(it.id));
      rows.set(it.id, row);
    }
    fillRow(row, it);
    if (row.nextElementSibling !== next || !row.isConnected) list.insertBefore(row, next);
    next = row;
  }
}

function select(id, scroll) {
  if (id === sel) return;
  rows.get(sel)?.classList.remove('sel');
  sel = id;
  const row = rows.get(sel);
  row?.classList.add('sel');
  if (scroll) row?.scrollIntoView({ block: 'nearest' });
  drawDetail(true);
}

const selectable = () => items.filter(it => it.kind !== 'heading');

addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const all = selectable();
    const i = all.findIndex(it => it.id === sel);
    const next = all[Math.max(0, Math.min(all.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) select(next.id, true);
    e.preventDefault();
  } else if (e.key === 'Enter') {
    const primary = detail.querySelector('button.primary');
    if (primary && !primary.disabled) primary.click();
  }
});

// MARK: Detail

function bar(id, parts, total) {
  const b = el('div', 'bar');
  const widths = parts.map(x => (100 * x / Math.max(total, 1)) + '%');
  const segs = ['shared', 'changed', 'only', 'unchecked'].map((k, i) => {
    const seg = b.appendChild(el('i', k));
    seg.style.width = bars.get(id)?.[i] ?? '0%';
    return seg;
  });
  // Next frame, so the widths transition from the last ones shown (or from empty)
  requestAnimationFrame(() => requestAnimationFrame(() => segs.forEach((s, i) => { s.style.width = widths[i]; })));
  bars.set(id, widths);
  return b;
}

function defaultKeep(s) {
  let best = 0;
  s.members.forEach((m, i) => { if (m.files > s.members[best].files) best = i; });
  return best;
}

function drawDetail(fresh) {
  const it = items.find(x => x.id === sel);
  const scroll = detail.scrollTop;
  detail.replaceChildren();
  if (!it) return;
  if (it.kind === 'set') drawSet(it.d); else drawFile(it.d);
  // A redraw of the same item keeps its place and doesn't fade in again
  if (!fresh) {
    detail.scrollTop = scroll;
    for (const c of detail.children) c.style.animation = 'none';
  }
  fit([...detail.querySelectorAll('.fit')]);
}

function drawSet(s) {
  const keep = keepBy.get(s.id) ?? defaultKeep(s);
  const kept = s.members[keep];
  const h = el('h1'); h.textContent = s.name;
  const meta = text('meta', s.members.length + ' folders · ' + s.wasted + ' wasted');
  meta.style.display = 'block';

  const head = el('div', 'section');
  const legend = el('span', 'legend');
  for (const [k, label] of [['shared', 'Copied elsewhere'], ['only', 'Only here'], ['changed', 'Changed'], ['unchecked', 'Not checked']]) {
    const entry = el('span'); entry.append(el('i', k), label); legend.append(entry);
  }
  head.append(text('', 'Keep which folder?'), el('span', 'spacer'), legend);

  const folders = el('div', 'card');
  const blockers = [];
  const offline = new Set();
  s.members.forEach((m, i) => {
    const isKept = i === keep;
    // Hashed files with no copy in the kept folder, beyond the ones only here or changed: their other copy is in a folder going too
    const elsewhere = isKept ? 0 : Math.max(0, m.missingFrom[keep] - m.onlyHere - m.changed);
    const where = m.drive + ' · ' + m.path;
    const parts = [];
    if (!isKept) {
      if (!m.connected) offline.add(m.drive);
      if (m.holdsAnother) {
        parts.push('holds another folder of this set');
        blockers.push({ color: 'var(--secondary)', label: 'Holds another folder of this set', where, action: 'Reveal in Finder', run: () => post({ action: 'reveal', set: s.id, member: m.id }) });
      }
      if (m.onlyHere) {
        parts.push(n(m.onlyHere) + ' only here');
        blockers.push({ color: 'var(--blue)', label: plural(m.onlyHere, 'file exists', 'files exist') + ' only in this folder', where, action: 'Copy to Kept Folder' });
      }
      if (m.changed) {
        parts.push(n(m.changed) + ' changed');
        blockers.push({ color: 'var(--orange)', label: plural(m.changed, 'file differs', 'files differ') + ' from the other copies', where, action: 'Compare…',
                        run: () => post({ action: 'compare', set: s.id, member: m.id, keep }) });
      }
      if (elsewhere) {
        parts.push(n(elsewhere) + ' not in kept folder');
        blockers.push({ color: 'var(--blue)', label: plural(elsewhere, 'file has its', 'files have their') + ' only other copy in a folder you’re removing', where, action: 'Copy to Kept Folder' });
      }
      if (m.unchecked) {
        parts.push(n(m.unchecked) + ' not checked');
        blockers.push({ color: 'var(--secondary)', label: plural(m.unchecked, 'file hasn’t', 'files haven’t') + ' been checked', where, action: 'Check Now' });
      }
    }

    const row = el('label', 'row member' + (isKept ? ' kept' : '') + (m.connected ? '' : ' off'));
    const radio = el('input');
    radio.type = 'radio'; radio.name = 'keep'; radio.checked = isKept;
    radio.addEventListener('change', () => { keepBy.set(s.id, i); drawDetail(false); });
    const col = el('div', 'col');
    const line = el('div', 'line');
    line.append(icon(m.driveIcon), text('drive', m.drive), fitText('path', m.path));
    if (isKept) line.append(text('tag', 'KEEP'));
    const status = isKept ? text('status keep', 'Keeping') : parts.length ? text('status', parts.join(', ')) : text('status safe', 'Safe to remove');
    const stats = el('div', 'small');
    stats.append(m.summary + ' — ', status);
    col.append(line, bar(m.id, [m.shared, m.changed, m.onlyHere, m.unchecked], m.files), stats);
    col.children[1].title = `${n(m.shared)} copied elsewhere, ${n(m.changed)} changed, ${n(m.onlyHere)} only here, ${n(m.unchecked)} not checked yet`;
    row.append(radio, col);
    row.addEventListener('contextmenu', () => post({ action: 'menu', set: s.id, member: m.id }));
    folders.append(row);
  });

  const head2 = el('div', 'section');
  head2.append(text('', 'Before removing the other folders'));
  const list2 = el('div', 'card');
  if (blockers.length) {
    for (const b of blockers) {
      const row = el('div', 'row');
      const dot = el('span', 'dot'); dot.style.background = b.color;
      const col = el('div', 'col'); col.style.gap = '1px';
      col.append(text('label', b.label), fitText('small path', b.where));
      // ponytail: Copy to Kept Folder and Check Now aren't built yet, so they stay disabled
      row.append(dot, col, button(b.action, 'push', b.run ?? (() => {}), !b.run));
      list2.append(row);
    }
  } else {
    const row = el('div', 'row clear', ICON.check);
    row.append(text('', 'Nothing blocking. Every file in the folders you’re removing has a copy in the one you’re keeping.'));
    list2.append(row);
  }

  const out = [h, meta, head, folders, head2, list2];
  if (offline.size) {
    const note = el('div', 'note small', ICON.info);
    note.append(`${[...offline].join(' and ')} ${offline.size === 1 ? 'is' : 'are'} offline. Connect ${offline.size === 1 ? 'it' : 'them'} to move ${offline.size === 1 ? 'its' : 'their'} folders to the Trash.`);
    out.push(note);
  }
  const removing = s.members.length - 1;
  const actions = el('div', 'actions');
  actions.append(
    button('Skip', 'push', () => {
      const all = selectable();
      const next = all[(all.findIndex(x => x.id === sel) + 1) % all.length];
      if (next) select(next.id, true);
    }),
    button(`Move ${plural(removing, 'Folder', 'Folders')} to Trash`, 'push primary', () => post({ action: 'trashOthers', set: s.id, keep }),
           blockers.length || offline.size));
  out.push(actions);
  detail.append(...out);
}

function drawFile(g) {
  const h = el('h1'); h.textContent = g.name;
  const meta = text('meta', `${g.copies} copies · ${g.size} each · ${g.wasted} wasted`);
  meta.style.display = 'block';
  const head = el('div', 'section');
  head.append(text('', 'Copies'));
  const card = el('div', 'card');
  for (const f of g.files) {
    const row = el('div', 'row' + (f.connected ? '' : ' off'));
    const line = el('div', 'line'); line.style.flex = '1';
    line.append(icon(f.driveIcon), text('drive', f.drive), fitText('path', f.path), text('secondary', f.date));
    const trash = el('button', '', ICON.trash);
    trash.title = 'Move this copy to the Trash';
    trash.disabled = !f.connected;
    trash.addEventListener('click', () => post({ action: 'trash', group: g.id, file: f.id }));
    row.append(line, trash);
    row.addEventListener('dblclick', () => post({ action: 'reveal', group: g.id, file: f.id }));
    row.addEventListener('contextmenu', () => post({ action: 'menu', group: g.id, file: f.id }));
    card.append(row);
  }
  detail.append(h, meta, head, card);
}

// The path widths follow the window
let frame = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(() => fit([...detail.querySelectorAll('.fit')]));
});

// MARK: Updates from Swift

function render(next) {
  const fresh = !items.length;
  data = next;
  document.documentElement.style.setProperty('--top', data.top + 'px');
  const files = data.groups.length + data.more;
  const old = selectable();
  items = [];
  if (data.sets.length) items.push({ kind: 'heading', id: 'h:sets', d: { title: 'Folders', count: data.sets.length.toLocaleString() + ' sets of copies' } });
  for (const s of data.sets) items.push({ kind: 'set', id: 's:' + s.id, d: s });
  if (files) items.push({ kind: 'heading', id: 'h:files', d: { title: 'Files', count: files.toLocaleString() + ' with a copy outside those folders' } });
  for (const g of data.groups) items.push({ kind: 'file', id: 'f:' + g.id, d: g });

  // A trashed selection hands it to whatever took its place in the list
  const all = selectable();
  const same = all.some(it => it.id === sel);
  if (!same) {
    const at = Math.max(0, old.findIndex(it => it.id === sel));
    sel = all[Math.min(at, all.length - 1)]?.id ?? null;
  }
  for (const id of keepBy.keys()) if (!data.sets.some(s => s.id === id)) keepBy.delete(id);

  more.parentNode.hidden = !data.more;
  more.textContent = `Show ${Math.min(data.more, 200)} More (${data.more.toLocaleString()} left)`;

  drawList(fresh);
  drawDetail(!same);
}
</script></body></html>
